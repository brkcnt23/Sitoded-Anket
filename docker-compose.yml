version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sitoded_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-users.sql:/docker-entrypoint-initdb.d/00-init-users.sql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitoded_network

volumes:
  postgres_data:

networks:
  sitoded_network:
    driver: bridge
